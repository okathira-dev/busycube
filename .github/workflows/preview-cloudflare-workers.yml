name: Preview Cloudflare Worker

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cloudflare-workers-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # fork由来またはDependabotのPull RequestにはWorkersを変更できる
    # Actions Secretを渡さない。通常のbuild checkは別Workflowで実行する。
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-workers-preview
    env:
      # OAuth Client IDは公開bundleへ入る値である。Repository／Environment
      # Variableを優先し、未設定時はSecretを参照する。
      VITE_BUSYCUBE_DRIVE_GOOGLE_CLIENT_ID: ${{ vars.BUSYCUBE_DRIVE_GOOGLE_CLIENT_ID || secrets.BUSYCUBE_DRIVE_GOOGLE_CLIENT_ID }}
      VITE_BUSYCUBE_FEDCM_GOOGLE_CLIENT_ID: ${{ vars.BUSYCUBE_FEDCM_GOOGLE_CLIENT_ID || secrets.BUSYCUBE_FEDCM_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Check
        run: pnpm run check
      - name: Test
        run: pnpm run test:ci
      - name: Build
        run: pnpm run build
      - name: Deploy PR preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # PRごとに本番とは別のWorkerを作り、同じPRの更新時だけ上書きする。
          # 本番Workerへ未確認のPR Versionをdeployしない。
          command: >-
            deploy
            --name busycube-pr-${{ github.event.pull_request.number }}
            --tag pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
            --message "PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
            --config dist/busycube/wrangler.json
      - name: Resolve preview URL
        id: preview_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: busycube-pr-${{ github.event.pull_request.number }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          subdomain="$(printf '%s' "$response" | jq --exit-status --raw-output '.result.subdomain')"
          echo "url=https://${WORKER_NAME}.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Publish preview summary
        env:
          PREVIEW_URL: ${{ steps.preview_url.outputs.url }}
        run: |
          {
            echo "## Cloudflare Worker preview"
            echo
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Commit: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- URL: $PREVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test preview
        env:
          PREVIEW_URL: ${{ steps.preview_url.outputs.url }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 60 \
            --output /dev/null \
            "$PREVIEW_URL/"

  cleanup:
    # PR内のWorkflow変更にcleanup用credentialを渡さず、base側のclosed eventで実行する。
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-workers-preview
    steps:
      - name: Delete PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: busycube-pr-${{ github.event.pull_request.number }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          if [ "$status" != '200' ] && [ "$status" != '204' ] && [ "$status" != '404' ]; then
            echo "PR Preview Workerの削除に失敗しました（HTTP $status）。" >&2
            cat "$response_file" >&2
            exit 1
          fi
          echo "${WORKER_NAME}を削除しました。" >> "$GITHUB_STEP_SUMMARY"
