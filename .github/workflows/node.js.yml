# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Check
        run: pnpm run check
      - name: Verify preview security boundaries
        run: node --test scripts/ci/*.test.mjs
      - name: Test
        run: pnpm run test:ci
      - name: Build
        run: pnpm run build
        env:
          VITE_BUSYCUBE_DRIVE_GOOGLE_CLIENT_ID: ${{ vars.BUSYCUBE_DRIVE_GOOGLE_CLIENT_ID }}
          VITE_BUSYCUBE_FEDCM_GOOGLE_CLIENT_ID: ${{ vars.BUSYCUBE_FEDCM_GOOGLE_CLIENT_ID }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke test
        run: pnpm run test:e2e
      - name: Save preview bundle after all CI checks pass
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-preview
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          include-hidden-files: true
          path: |
            dist/client/
            dist/busycube/
            !dist/busycube/wrangler.json
            !dist/busycube/.vite/
            !dist/**/.dev.vars*
            !dist/**/.env*
